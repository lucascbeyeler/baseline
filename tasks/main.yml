---
#
# Update packages
###############################################################################
- name: Install EPEL release for RedHat System
  ansible.builtin.dnf:
    name: "{{ baseline_epel_package }}"
    state: present
  when:
    - ansible_os_family == "RedHat"
    - baseline_install_epel | bool

- name: Updating all the packages for Ubuntu/Debian System
  ansible.builtin.apt:
    upgrade: full
    update_cache: true
    cache_valid_time: 3600
  when:
    - ansible_os_family == "Debian"
    - baseline_full_upgrade | bool

- name: Updating all the packages for CentOS/RedHat System
  ansible.builtin.dnf:
    name: "*"
    state: latest  # noqa package-latest
    update_cache: true
  when:
    - ansible_os_family == "RedHat"
    - baseline_full_upgrade | bool

- name: Install the default packages for the playbook
  ansible.builtin.package:
    name: "{{ multidist + (debian if ansible_os_family == 'Debian' else centos) + baseline_family_packages }}"
    state: present

#
# Timezone and Clock
################################################################################
- name: Changing the timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Configuring the Chrony NTP client
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: "{{ baseline_chrony_conf }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

#
# Hostname and Network
################################################################################
- name: Changing the hostname
  ansible.builtin.hostname:
    name: "{{ hostname }}.{{ domain }}"

- name: Including the hostname in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ hostname }}.{{ domain }} {{ hostname }}"
    state: present
  when: ansible_virtualization_type != "docker"

#
# Enable services
################################################################################
- name: Enabling the NTP service
  ansible.builtin.service:
    name: "{{ baseline_chrony_service }}"
    state: started
    enabled: true
  when: baseline_manage_services | bool

#
# Creating .hushlogin for new users (/etc/skel) and for root
################################################################################
- name: Create .hushlogin
  ansible.builtin.file:
    path: "{{ item }}"
    state: touch
    owner: root
    group: root
    mode: "0600"
    access_time: preserve
    modification_time: preserve
  loop:
    - /etc/skel/.hushlogin
    - /root/.hushlogin
  when: enable_hushlogin is none or enable_hushlogin | bool

#
# Editing SSH for more security
################################################################################
- name: Allow the custom SSH port in SELinux
  community.general.seport:
    ports: "{{ ssh_port }}"
    proto: tcp
    setype: ssh_port_t
    state: present
  when:
    - ssh_port is defined
    - ansible_os_family == "RedHat"
    - ansible_selinux.status | default('disabled') == "enabled"

- name: Modifing SSH's default port
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*Port\s'
    line: "Port {{ ssh_port }}"
    state: present
    validate: /usr/sbin/sshd -t -f %s
  when: ssh_port is defined
  notify: Reload sshd

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PermitRootLogin\s'
    line: "PermitRootLogin {{ baseline_ssh_permit_root_login }}"
    state: present
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
