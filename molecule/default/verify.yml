---
- name: Verify
  hosts: all
  gather_facts: true
  vars:
    chrony_conf: "{{ '/etc/chrony/chrony.conf' if ansible_os_family == 'Debian' else '/etc/chrony.conf' }}"
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert the packages are installed
      ansible.builtin.assert:
        that:
          - "'vim' in ansible_facts.packages or 'vim-enhanced' in ansible_facts.packages"
          - "'git' in ansible_facts.packages"
          - "'htop' in ansible_facts.packages"
          - "'chrony' in ansible_facts.packages"

    # Containers have no systemd, so timedatectl/hostnamectl are not usable
    - name: Check timezone
      ansible.builtin.stat:
        path: /etc/localtime
      register: localtime_stat

    - name: Assert timezone is set
      ansible.builtin.assert:
        that:
          - localtime_stat.stat.lnk_source is search('Europe/Dublin$')

    - name: Check chrony configuration
      ansible.builtin.slurp:
        src: "{{ chrony_conf }}"
      register: chrony_conf_content

    - name: Assert chrony uses the configured servers
      ansible.builtin.assert:
        that:
          - "'server 0.pool.ntp.org iburst' in chrony_conf_content.content | b64decode"

    # Containers cannot change the running hostname, so check the persisted one
    - name: Check hostname
      ansible.builtin.slurp:
        src: /etc/hostname
      register: hostname_content

    - name: Assert hostname is set
      ansible.builtin.assert:
        that:
          - hostname_content.content | b64decode | trim == 'test-host.example.com'

    # /etc/hosts is managed by Docker, so the role skips it inside containers
    - name: Read /etc/hosts content
      ansible.builtin.slurp:
        src: /etc/hosts
      register: hosts_content
      when: ansible_virtualization_type != "docker"

    - name: Assert /etc/hosts entry exists
      ansible.builtin.assert:
        that:
          - "'127.0.1.1 test-host.example.com test-host' in hosts_content.content | b64decode"
      when: ansible_virtualization_type != "docker"

    - name: Check .hushlogin files
      ansible.builtin.stat:
        path: "{{ item }}"
      register: hushlogin_stat
      loop:
        - /etc/skel/.hushlogin
        - /root/.hushlogin

    - name: Assert .hushlogin files exist with the right permissions
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'root'
          - item.stat.gr_name == 'root'
          - item.stat.mode == '0600'
      loop: "{{ hushlogin_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the effective sshd configuration
      ansible.builtin.command: /usr/sbin/sshd -T
      changed_when: false
      register: sshd_effective

    - name: Assert sshd listens only on the custom port and root login is disabled
      ansible.builtin.assert:
        that:
          - sshd_effective.stdout_lines | select('match', '^port ') | list == ['port 2222']
          - "'permitrootlogin no' in sshd_effective.stdout_lines"
