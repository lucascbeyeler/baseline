---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    # raw prints nothing until it ends, so a stalled download would run until
    # CI kills the job without a message. The timeouts turn it into an error.
    - name: Install Python 3 and sudo
      ansible.builtin.raw: >-
        if command -v apt-get >/dev/null; then
        export DEBIAN_FRONTEND=noninteractive;
        apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
        apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y python3 sudo;
        else
        dnf --setopt=retries=3 --setopt=timeout=30 install -y python3 sudo;
        fi
      changed_when: true
      timeout: 420

    - name: Gather facts
      ansible.builtin.setup:

    - name: Install OpenSSH server
      ansible.builtin.package:
        name: openssh-server
        state: present

    # sshd -t (used to validate sshd_config) needs this directory, which is
    # normally created by systemd when the service starts
    - name: Create the sshd privilege separation directory
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        mode: "0755"

    - name: Generate SSH host keys
      ansible.builtin.command: ssh-keygen -A
      changed_when: false

    # Like RHEL's installer does when root login is allowed, a drop-in that
    # would override PermitRootLogin in sshd_config
    - name: Create a drop-in that allows root login
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/01-permitrootlogin.conf
        content: "PermitRootLogin yes\n"
        mode: "0600"

    # Like a fresh image: the role must refresh the APT cache itself when the
    # full upgrade is off
    - name: Empty the APT cache
      ansible.builtin.shell: rm -rf /var/lib/apt/lists/* /var/cache/apt/*.bin && touch -d '2 days ago' /var/lib/apt/lists
      changed_when: true
      when: ansible_os_family == "Debian"
