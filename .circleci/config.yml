version: 2.1
jobs:
  lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Ansible
          command: pip install ansible ansible-lint
      - run:
          name: Create ansible.cfg
          command: printf '[defaults]\nroles_path=../' >ansible.cfg
      - run:
          name: Lint the role
          command: ansible-lint
      - run:
          name: Syntax check
          command: ansible-playbook -i tests/inventory tests/test.yml --syntax-check
      - run:
          name: Unit tests
          command: ansible-playbook tests/unit/main.yml
  molecule:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Run Molecule
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install -r requirements.txt
            ansible-galaxy collection install -r requirements.yml community.docker
            molecule test
  ansible-galaxy:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Ansible
          command: pip install ansible
      - run:
          name: Deploy to Ansible Galaxy
          command: ansible-galaxy role import --api-key $GALAXY_API_KEY lucascbeyeler baseline
workflows:
  version: 2
  build-and-test:
    jobs:
      - lint
      - molecule
      - ansible-galaxy:
          requires:
            - lint
            - molecule
          filters:
            branches:
              only: master
